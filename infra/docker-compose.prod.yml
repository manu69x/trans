# Trans — PRODUCTION profile overlay (PRD §13/§14 hardening).
#
# Use together with the base compose file:
#
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/docker-compose.prod.yml up -d
#
# Differences vs. dev:
#   * every container: non-root user, noNewPrivileges, resource limits,
#     read-only rootfs where the image allows it;
#   * db/minio/redis: NOT published on the host (internal network only);
#   * a single TLS entrypoint (nginx, self-signed LAN cert, §13.1 "TLS
#     anche in LAN") in front of backend + frontend;
#   * secrets come from env / ./secrets (outside the repo, §13.1) —
#     JWT_SECRET, MINIO access keys, POSTGRES_PASSWORD are mandatory;
#   * storage-at-rest key mounted from outside the repo (crypto_at_rest),
#     backup key likewise (backup.py).
name: trans-prod

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *hardening
    expose:
      - "5432"
    ports: []           # not reachable from the LAN in prod
    user: "999:999"     # postgres user in the pgvector image
    environment:
      POSTGRES_USER: trans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trans}
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trans -d ${POSTGRES_DB:-trans}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    <<: *hardening
    expose:
      - "6379"
    ports: []
    user: "999:1000"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  minio:
    <<: *hardening
    expose:
      - "9000"
    ports: []           # console 9001 not exposed in prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    user: "1000:1000"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  backend:
    <<: *hardening
    expose:
      - "8000"
    ports: []           # served through the TLS gateway instead
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: postgresql://trans:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trans}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random bytes)}
      TRANS_URL_SIGNING_KEY: ${TRANS_URL_SIGNING_KEY:-${JWT_SECRET}}
      TRANS_STORAGE_KEY_FILE: /run/secrets/trans_storage_key
      TRANS_BACKUP_KEY_FILE: /run/secrets/trans_backup_key
      TRANS_ASSET_RETENTION_DAYS: ${TRANS_ASSET_RETENTION_DAYS:-0}
      LOCAL_ONLY: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../backend:/app:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    <<: *hardening
    expose:
      - "3000"
    ports: []
    user: "1000:1000"
    environment:
      NEXT_PUBLIC_API_BASE: /api
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  worker:
    <<: *hardening
    user: "1000:1000"
    environment:
      DATABASE_URL: postgresql://trans:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trans}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      TRANS_STORAGE_KEY_FILE: /run/secrets/trans_storage_key
      TRANS_ASSET_RETENTION_DAYS: ${TRANS_ASSET_RETENTION_DAYS:-0}
      LOCAL_ONLY: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ../worker:/app:ro
      - ./secrets:/run/secrets:ro
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "3.0"

  # §13.1 "TLS anche in LAN": single TLS entrypoint. Generate the self-signed
  # LAN certificate once with:
  #   openssl req -x509 -newkey rsa:4096 -sha256 -days 825 -nodes \
  #     -keyout infra/tls/trans.key -out infra/tls/trans.crt \
  #     -subj "/CN=trans.local" -addext "subjectAltName=DNS:trans.local,IP:127.0.0.1"
  tls:
    image: nginx:1.27-alpine
    container_name: trans-tls
    <<: *hardening
    ports:
      - "443:8443"
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
  redis-data:
  minio-data:
