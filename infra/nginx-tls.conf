# TLS gateway for the Trans prod profile (§13.1 "TLS anche in LAN").
# Terminates HTTPS for backend API + frontend; forwards client IP so the
# backend rate limiter buckets per real client.

upstream trans_backend {
    server backend:8000;
    keepalive 16;
}

upstream trans_frontend {
    server frontend:3000;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name trans.local;

    ssl_certificate     /etc/nginx/tls/trans.crt;
    ssl_certificate_key /etc/nginx/tls/trans.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 110m;   # the §5.2 100 MB upload budget

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass http://trans_backend;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://trans_backend/health;
    }

    location / {
        proxy_pass http://trans_frontend;
    }
}
