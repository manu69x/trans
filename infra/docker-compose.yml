# Trans — local literary translation platform (EN→IT). Pure local stack, no cloud.
# See README.md for ports and commands.
x-common-env: &common-env
  LOG_LEVEL: "${LOG_LEVEL:-info}"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: trans-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trans
      POSTGRES_PASSWORD: trans
      POSTGRES_DB: ${POSTGRES_DB:-trans}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Niente init SQL: lo schema è gestito SOLO da Alembic; il container
      # backend esegue `alembic upgrade head` al boot (migrations/env.py
      # crea anche l'estensione pgvector). Vedi docs/DOCKER.md.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trans -d ${POSTGRES_DB:-trans}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  redis:
    image: redis:7-alpine
    container_name: trans-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: trans-minio
    restart: unless-stopped
    command: server /data --console-address "0.0.0.0:9001"
    ports:
      - "9000:9000"   # MinIO API (S3)
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: trans-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # +psycopg2 esplicito: con sqlalchemy>=2.1 (tiratosi giu' a un
      # rebuild senza pin) il default di postgresql:// diventa
      # psycopg3, non installato nell'immagine: crash-loop (2026-09-24)
      DATABASE_URL: postgresql+psycopg2://trans:trans@db:5432/${POSTGRES_DB:-trans}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Default models for NEW projects (§8.1/§8.2). Override via .env.
      TRANS_DEFAULT_TRANSLATION_MODEL: ${TRANS_DEFAULT_TRANSLATION_MODEL:-translategemma-27b-it_G0}
      # Gateway Proxy (ADR-001: unico provider LLM/NLP, §13.1).
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-http://host.docker.internal:8080/v1}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-sk-mia-chiave-super-segreta}
      TRANS_DEFAULT_TEXT_MODEL: ${TRANS_DEFAULT_TEXT_MODEL:-}
      TRANS_DEFAULT_TEMPERATURE: ${TRANS_DEFAULT_TEMPERATURE:-0.2}
      TRANS_DEFAULT_TOP_P: ${TRANS_DEFAULT_TOP_P:-0.9}
      TRANS_DEFAULT_TOP_K: ${TRANS_DEFAULT_TOP_K:-40}
      TRANS_DEFAULT_REASONING: ${TRANS_DEFAULT_REASONING:-none}
      TRANS_DEFAULT_MAX_OUTPUT_TOKENS: ${TRANS_DEFAULT_MAX_OUTPUT_TOKENS:-16384}
      # §2.1 bootstrap admin (seed idempotente al boot; DEV locale: override
      # via .env. Il profilo prod usa i secrets obbligatori).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@trans.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-trans-admin}
      # 2026-10-01, richiesta utente: portale senza login. Revertibile: 0.
      AUTH_DISABLED: ${AUTH_DISABLED:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # DR/ freshness: lo schema è applicato da Alembic PRIMA di avviare l'API
    # (un volume db fresco parte da zero). Il bind ../backend:/app è stato
    # rimosso: con Docker Desktop il mount presentava /app vuoto e il codice
    # effettivamente eseguito è quello installato nell'immagine (pip install .).
    command: sh -c "alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: trans-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      # server-side rewrite target (next.config.js): the frontend container
      # must reach the backend via the compose network, NOT 127.0.0.1 (which
      # would be itself) and the browser must use relative paths (no CORS).
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE: ""
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',(r)=>process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: trans-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://trans:trans@db:5432/${POSTGRES_DB:-trans}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes: []
    # Niente bind mount del pacchetto worker: il bridge di file sharing
    # Docker Desktop<->WSL serve directory vuote per i mount dal filesystem
    # di Ubuntu (verificato 2026-09-23, anche dopo restart dell'engine).
    # Il pacchetto e' gia' nell'immagine (COPY worker/ ./worker/): dopo una
    # modifica al codice worker va fatto `docker compose build worker`.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db-data:
  redis-data:
  minio-data:
