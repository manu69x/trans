# Trans — local literary translation platform (EN→IT). Pure local stack, no cloud.
# See README.md for ports and commands.
x-common-env: &common-env
  LOG_LEVEL: "${LOG_LEVEL:-info}"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: trans-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trans
      POSTGRES_PASSWORD: trans
      POSTGRES_DB: ${POSTGRES_DB:-trans}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # No init SQL: the schema is managed by Alembic only; the backend
      # container runs `alembic upgrade head` at boot (migrations/env.py
      # also creates the pgvector extension). See docs/DEPLOYMENT.md.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trans -d ${POSTGRES_DB:-trans}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  redis:
    image: redis:7-alpine
    container_name: trans-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: trans-minio
    restart: unless-stopped
    command: server /data --console-address "0.0.0.0:9001"
    ports:
      - "9000:9000"   # MinIO API (S3)
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: trans-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Explicit +psycopg2: with sqlalchemy>=2.1 the plain postgresql:// URL
      # defaults to the psycopg3 driver, which is not installed in the
      # image, so pin the driver in the URL.
      DATABASE_URL: postgresql+psycopg2://trans:trans@db:5432/${POSTGRES_DB:-trans}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Default models for NEW projects (§8.1/§8.2). Override via .env.
      TRANS_DEFAULT_TRANSLATION_MODEL: ${TRANS_DEFAULT_TRANSLATION_MODEL:-translategemma-27b-it}
      # LLM Gateway (ADR-001: the single LLM/NLP provider, §13.1).
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-http://host.docker.internal:8080/v1}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-sk-local-dev-change-me}
      # QE verification endpoint (see deploy/qe-service/README.md). Leave
      # QE_BASE_URL empty to derive it from the gateway (/upstream/qe).
      QE_BASE_URL: ${QE_BASE_URL:-}
      QE_MODEL: ${QE_MODEL:-qe-verify}
      TRANS_DEFAULT_TEXT_MODEL: ${TRANS_DEFAULT_TEXT_MODEL:-}
      TRANS_DEFAULT_TEMPERATURE: ${TRANS_DEFAULT_TEMPERATURE:-0.2}
      TRANS_DEFAULT_TOP_P: ${TRANS_DEFAULT_TOP_P:-0.9}
      TRANS_DEFAULT_TOP_K: ${TRANS_DEFAULT_TOP_K:-40}
      TRANS_DEFAULT_REASONING: ${TRANS_DEFAULT_REASONING:-none}
      TRANS_DEFAULT_MAX_OUTPUT_TOKENS: ${TRANS_DEFAULT_MAX_OUTPUT_TOKENS:-16384}
      # §2.1 bootstrap admin (idempotent seed at boot). DEV defaults below —
      # override via .env; the prod profile requires explicit secrets.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@trans.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-trans-admin}
      # Authentication is ON by default. Set to 1 only for air-gapped
      # single-user machines (every anonymous request becomes admin).
      AUTH_DISABLED: ${AUTH_DISABLED:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # DR / freshness: the schema is applied by Alembic BEFORE the API
    # starts (a fresh db volume boots from zero). There is deliberately no
    # ../backend:/app bind mount: the code that runs is the one installed
    # in the image (pip install .), so code changes require a rebuild.
    command: sh -c "alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: trans-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      # server-side rewrite target (next.config.js): the frontend container
      # must reach the backend via the compose network, NOT 127.0.0.1 (which
      # would be itself) and the browser must use relative paths (no CORS).
      BACKEND_URL: http://backend:8000
      # server-side gateway proxy target for /api/gateway/* (route handler)
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://host.docker.internal:8080}
      NEXT_PUBLIC_API_BASE: ""
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',(r)=>process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: trans-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://trans:trans@db:5432/${POSTGRES_DB:-trans}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes: []
    # No bind mount of the worker package on purpose: the code runs from the
    # image (COPY worker/ ./worker/), so after changing worker code run
    # `docker compose build worker` and bring the stack up again.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db-data:
  redis-data:
  minio-data:
