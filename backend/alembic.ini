# Alembic configuration for the Trans backend.
# See https://alembic.sqlalchemy.org for full documentation.

[alembic]
# Path to migration scripts.
# This is a relative-to-cwd path; the docker `migrate` target runs from
# inside the backend build context so this resolves to backend/migrations.
script_location = migrations

# Template format used by `alembic revision`:
template = script.py.mako

# Database connection: overridden at runtime via the ALEMBIC_SQLALCHEMY_URI
# environment variable (see env.py). Default mirrors the compose DATABASE_URL.
sqlalchemy.url = postgresql://trans:trans@db:5432/trans

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
